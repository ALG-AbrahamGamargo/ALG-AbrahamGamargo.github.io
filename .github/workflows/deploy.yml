name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # El sitio ya viene compilado en la raiz (index.html + assets/).
      #
      # AVISO: este paso DEBE ser v4. Con v3 el artefacto se sube con otro
      # nombre y `deploy-pages@v4` no lo encuentra, con el error:
      #   "No artifacts named github-pages were found for this workflow run"
      # El cambio a Node 24 (septiembre 2025) dejo de emparejar la v3 con la
      # v4. Sin esto, TODO push a main falla el deploy.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
